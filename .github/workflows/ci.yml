# Typecheck and build every PR into main/staging. The job name "ci" is the
# required status check in the rulesets, so keep the two in sync.
name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Without these, prerendering "/" fails with a bare "[500] Server Error".
      - name: Check Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is missing (Settings → Secrets and variables → Actions → Repository secrets)."
              missing=1
            fi
          done
          exit $missing
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
        env:
          # Prerendering "/" reads Supabase. Anon key only, never the service key.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
